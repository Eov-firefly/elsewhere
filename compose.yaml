services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: elsewhere
      POSTGRES_PASSWORD: elsewhere
      POSTGRES_DB: elsewhere
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elsewhere"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
